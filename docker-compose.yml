# Development: application code is bind-mounted from ./www
# Usage: docker compose up -d
# For the self-contained image see docker-compose.standalone.yml

services:
  unimarc2marc21:
    image: datascouting/unimarc2marc21:base
    build:
      context: .
      target: base
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        TIMEZONE: ${TIMEZONE:-Europe/Athens}
        LOCALE: ${LOCALE:-en_US.UTF-8}
        PHP_INI_PROFILE: ${PHP_INI_PROFILE:-production}
    container_name: unimarc2marc21-service
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./www:/var/www/html
